<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!--Edit-->
  <title>ระบบคำนวณต้นทุนท่อ - Cost Calculation System</title>
  <!--End Edit-->
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="ระบบคำนวณต้นทุนท่อ">
  <meta name="theme-color" content="#faf7f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #faf7f2;
      --color-ink: #201515;
      --color-muted: #6e6761;
      --color-primary: #ff4f00;
      --color-primary-hover: #e04500;
      --font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-cream);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    /* Iframe Wrapper Container */
    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-cream);
    }

    /* Fullscreen iframe that embeds the Google Apps Script Web App */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
    }

    /* Loading Screen (Splash Screen) */
    .loading-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }

    /* Animated Brand Loader */
    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 79, 0, 0.15);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-ink);
    }

    .loading-subtext {
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    /* Fallback link */
    .fallback-note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: var(--color-muted);
    }

    .fallback-link {
      color: var(--color-primary);
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="loading-content">
      <div class="spinner-ring" role="status" aria-label="กำลังโหลด..."></div>
      <!--Edit-->
      <div class="app-title">ระบบคำนวณต้นทุนท่อ</div>
      <!--End Edit-->
      <div class="loading-subtext">กำลังเปิดระบบ กรุณารอสักครู่...</div>
      <div class="fallback-note">
        หากหน้านี้ไม่แสดงผล <a class="fallback-link" href="https://script.google.com/macros/s/AKfycbz5VI09DmCJD1_LYJq2_8q56eEweYw9QSklam9lLL38GLV9FacvTJfBc86tF95tNwy9/exec" target="_blank" rel="noopener noreferrer">คลิกที่นี่เพื่อเปิดโดยตรง</a>
      </div>
    </div>
  </div>

  <!-- Fullscreen Web App Embed Container -->
  <main class="app-container">
    <iframe 
      id="appFrame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbxF2et_hUxFX8Tv_9ad28KSWG7x4bmdf7zNZttRHp4XiWD0wE_8ARl7E5vQnZ6ykoUqtw/exec"
      title="ระบบลางานออนไลน์"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; geolocation; gyroscope; microphone; camera; web-share"
      allowfullscreen="true">
    </iframe>
  </main>

  <script>
    (function() {
      var loader = document.getElementById('loadingScreen');
      var iframe = document.getElementById('appFrame');

      function hideLoader() {
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
        }
      }

      // เมื่อ iframe โหลดเสร็จ ซ่อนหน้าจอ Loading
      iframe.addEventListener('load', function() {
        setTimeout(hideLoader, 250);
      });

      // ป้องกันกรณีเครือข่ายช้าหรือไม่ได้รับ event load (fallback 5 วินาที)
      setTimeout(hideLoader, 5000);
    })();
  </script>
</body>
</html>
